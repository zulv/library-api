services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/bundle
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      SOLID_QUEUE_IN_PUMA: "true"
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 2fKCyy5lzWWkXSOdP9O9U8btkOz8U1Uo
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: xEXmNsuDfrJeLAgyQadD4OB1tzl2UgAI
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: f6XPFUmyX3pitonivOJPOHafOPKflmVJ
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    tty: true
    stdin_open: true

volumes:
  postgres:
  bundle:
