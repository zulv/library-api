default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  primary: &primary_development
    <<: *default
    database: library_api_development
  cache:
    <<: *primary_development
    database: library_api_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: library_api_development_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: library_api_test

production:
  primary: &primary_production
    <<: *default
    database: library_api_production
    username: library_api
    password: <%= ENV["LIBRARY_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: library_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: library_api_production_queue
    migrations_paths: db/queue_migrate
